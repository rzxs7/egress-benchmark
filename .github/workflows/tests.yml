name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  large-file-test:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run 300 MiB artifact test'
    runs-on: ubuntu-latest
    steps:
      - name: Generate 300 MiB incompressible file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          target = Path("large-test-300MiB.bin")
          total = 300 * 1024 * 1024
          chunk = 4 * 1024 * 1024

          with target.open("wb") as f:
              remaining = total
              while remaining:
                  n = min(chunk, remaining)
                  f.write(os.urandom(n))
                  remaining -= n

          actual = target.stat().st_size
          assert actual == total, (actual, total)
          print(f"Created {target}: {actual} bytes")
          PY

      - name: Verify exact size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          stat --printf="bytes=%s\n" large-test-300MiB.bin
          sha256sum large-test-300MiB.bin | tee large-test-300MiB.sha256

      - name: Upload 300 MiB artifact
        uses: actions/upload-artifact@v4
        with:
          name: large-test-300MiB
          path: |
            large-test-300MiB.bin
            large-test-300MiB.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
